server {
    listen 8080;
    server_name _;
    # Relative redirects preserve the public HTTPS host behind the TLS proxy.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz { access_log off; return 200 'ok'; }
    location /_expo/ { try_files $uri =404; expires 1y; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /pdf.worker.min.mjs { try_files $uri =404; expires 1h; }
    rewrite ^/(en|ru|az)/account/verify$ /verify-email redirect;
    rewrite ^/(en|ru|az)/account/reset$ /reset-password redirect;
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-store';
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
